<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock, Paper, Scissors</title>
  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER: game title and short instruction -->
  <header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
  </header>

  <!-- PLAYER SECTION: name input and Start Game button -->
  <section id="player">
    <label for="playerName">Your name:</label>
    <input type="text" id="playerName" placeholder="Enter your name">
    <button onclick="startGame()">Start Game</button>
    <p id="welcome"></p>
  </section>

  <!-- GAME SECTION: three choice buttons and two images -->
  <section id="game">
    <div class="choices">
      <button onclick="playRound('rock')">Rock</button>
      <button onclick="playRound('paper')">Paper</button>
      <button onclick="playRound('scissors')">Scissors</button>
    </div>
    <div class="arena">
      <div><p>You</p><img id="playerImg" src="rock.png" alt="Player choice"></div>
      <span class="vs">VS</span>
      <div><p>Computer</p><img id="computerImg" src="rock.png" alt="Computer choice"></div>
    </div>
  </section>

  <!-- RESULT SECTION: result message and scoreboard -->
  <section id="resultSection">
    <p id="result"></p>
    <p class="score">
      Wins: <span id="wins">0</span> &nbsp;
      Losses: <span id="losses">0</span> &nbsp;
      Draws: <span id="draws">0</span>
    </p>
  </section>

  <!-- HISTORY SECTION: table of every round -->
  <section id="historySection">
    <h2>History</h2>
    <table id="history">
      <thead>
        <tr><th>Round</th><th>You</th><th>Computer</th><th>Result</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div class="actions">
      <button onclick="showSummary()">Show Summary</button>
      <button onclick="resetGame()">Reset</button>
    </div>
  </section>

  <!-- FOOTER: start time and copyright -->
  <footer>
    <p id="startTime"></p>
    <p>&copy; 2026 Computer Science Club</p>
  </footer>

  <!-- Link to external JavaScript file (before closing body) -->
  <script src="game.js"></script>
</body>
</html>
