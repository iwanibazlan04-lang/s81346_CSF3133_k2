<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 3 - Contact Form</title>
  <style>
    body   { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    .header, .footer { background: #2c3e50; color: white; text-align: center; padding: 20px; }
    .content { max-width: 500px; margin: 20px auto; padding: 0 15px; }
    .form-box, .calc-box { background: white; padding: 20px; margin-bottom: 20px;
                           border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    label  { display: block; margin-top: 12px; font-weight: bold; }
    input  { margin-top: 5px; padding: 6px; }
    button { margin-top: 15px; padding: 8px 20px; }
  </style>
</head>
<body>

  <!-- 1. HEADER SECTION -->
  <div class="header">
    <h1>Contact Us</h1>
    <span>We'd love to hear from you!</span>
  </div>

  <!-- 2. CONTENT SECTION -->
  <div class="content">

    <!-- Contact form -->
    <div class="form-box">
      <h2>Contact Form</h2>
      <form action="#" method="post">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="date">Preferred Contact Date:</label>
        <input type="date" id="date" name="date">

        <label for="satisfaction">Satisfaction Level:</label>
        <input type="range" id="satisfaction" name="satisfaction"
               min="1" max="10" value="5"
               oninput="level.value = this.value">
        <output id="level">5</output> / 10

        <br>
        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- 3. INLINE CALCULATOR -->
    <div class="calc-box">
      <h2>Inline Calculator</h2>
      <form oninput="result.value = Number(num1.value) + Number(num2.value)">
        <input type="number" id="num1" name="num1" value="0"> +
        <input type="number" id="num2" name="num2" value="0"> =
        <output name="result" for="num1 num2">0</output>
      </form>
    </div>

  </div>

  <!-- 4. FOOTER SECTION -->
  <div class="footer">
    <p>Email: info@example.com | Phone: +60 9-668 3000</p>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </div>

</body>
</html>
